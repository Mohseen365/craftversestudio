<template>
    <lightning-card title="Order Tracking" icon-name="standard:shipment">
        <div class="slds-p-around_medium">
            <template if:true={orderId}>
                <lightning-record-view-form
                    record-id={orderId}
                    object-api-name="Bouquet_Order__c">
                    <div class="slds-box slds-m-bottom_medium">
                        <lightning-output-field field-name="Order_Number__c"></lightning-output-field>
                        <lightning-output-field field-name="Status__c"></lightning-output-field>
                        <lightning-output-field field-name="Total_Amount__c"></lightning-output-field>
                    </div>
                </lightning-record-view-form>

                <template if:true={showPaymentUpload}>
                    <div class="slds-box slds-theme_shade">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Upload Payment Proof</h3>
                        <lightning-file-upload
                            label="Attach screenshot"
                            name="fileUploader"
                            accept={acceptedFormats}
                            record-id={orderId}
                            onuploadfinished={handleUploadFinished}
                            multiple="false">
                        </lightning-file-upload>
                    </div>
                </template>
            </template>
            <!-- ... -->
        </div>
    </lightning-card>
</template>
