<template>
    <div class="slds-grid slds-wrap slds-gutters">
        <template for:each={products} for:item="product">
            <div key={product.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-m-bottom_medium">
                <c-bouquet-product-card product={product} onordernow={handleOrderNow}></c-bouquet-product-card>
            </div>
        </template>
    </div>
</template>
