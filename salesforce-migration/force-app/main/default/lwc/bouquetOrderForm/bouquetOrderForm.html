<template>
    <div class="slds-p-around_medium slds-theme_default">
        <h1 class="slds-text-heading_large slds-m-bottom_large font-serif">Order Bouquet</h1>

        <template if:true={error}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                <h2>{error}</h2>
            </div>
        </template>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                <div class="slds-form slds-form_stacked">
                    <!-- Guest / Login Section -->
                    <template if:false={isLoggedIn}>
                        <div class="slds-box slds-m-bottom_large slds-theme_shade">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-grow">
                                    <h3 class="slds-text-heading_small">Already have an account?</h3>
                                    <p class="slds-text-color_weak">Log in to your account to save addresses and track easily.</p>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <c-bouquet-google-signin label="Sign in"></c-bouquet-google-signin>
                                </div>
                            </div>
                        </div>

                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shade">
                                <span class="slds-truncate slds-p-horizontal_small" title="Contact Information">Contact Information</span>
                            </h3>
                            <div class="slds-section__content">
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="First Name" name="firstName" required onchange={handleInputChange}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Last Name" name="lastName" required onchange={handleInputChange}></lightning-input>
                                    </div>
                                </div>
                                <lightning-input type="email" label="Email" name="email" required onchange={handleInputChange}></lightning-input>
                                <lightning-input type="tel" label="Phone" name="phone" required onchange={handleInputChange}></lightning-input>
                            </div>
                        </div>
                    </template>

                    <div class="slds-section slds-is-open">
                        <h3 class="slds-section__title slds-theme_shade">
                            <span class="slds-truncate slds-p-horizontal_small" title="Delivery Address">Delivery Address</span>
                        </h3>
                        <div class="slds-section__content">
                            <lightning-input label="Street Address" name="address" required onchange={handleInputChange}></lightning-input>
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input label="City" name="city" required onchange={handleInputChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input label="State" name="state" required onchange={handleInputChange}></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-3">
                                    <lightning-input label="Pincode" name="pincode" required onchange={handleInputChange} pattern="[0-9]{6}" message-when-pattern-mismatch="Please enter a 6-digit pincode."></lightning-input>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-section slds-is-open">
                        <h3 class="slds-section__title slds-theme_shade">
                            <span class="slds-truncate slds-p-horizontal_small" title="Order Details">Order Details</span>
                        </h3>
                        <div class="slds-section__content">
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-combobox label="Occasion Type" name="occasionType" value={formData.occasionType} options={occasionOptions} onchange={handleInputChange}></lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input label="Occasion Date" type="date" name="occasionDate" min={minDate} required onchange={handleInputChange}></lightning-input>
                                </div>
                            </div>
                            <lightning-input type="number" label="Quantity" name="quantity" value={formData.quantity} min="1" max="10" onchange={handleInputChange}></lightning-input>
                            <lightning-textarea label="Gift Message" name="giftMessage" onchange={handleInputChange}></lightning-textarea>
                            <lightning-textarea label="Additional Notes" name="notes" onchange={handleInputChange}></lightning-textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar: Summary -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="slds-box slds-theme_shade sticky-top">
                    <h3 class="slds-text-heading_small slds-border_bottom slds-p-bottom_x-small">Summary</h3>
                    <div class="slds-m-top_small">
                        <p class="slds-grid slds-grid_align-spread">
                            <span class="slds-text-color_weak">Subtotal:</span>
                            <strong>₹{subtotal}</strong>
                        </p>
                        <p class="slds-grid slds-grid_align-spread slds-m-top_xx-small">
                            <span class="slds-text-color_weak">Delivery:</span>
                            <span class="slds-text-color_success">FREE</span>
                        </p>
                    </div>
                    <div class="slds-m-top_large slds-border_top slds-p-top_small">
                        <p class="slds-grid slds-grid_align-spread slds-text-heading_medium">
                            <span>Total:</span>
                            <strong>₹{subtotal}</strong>
                        </p>
                    </div>
                    <lightning-button variant="brand" label="Place Order" onclick={handleSubmit} class="slds-m-top_large slds-button_stretch" stretch disabled={isSubmitting}></lightning-button>
                    <p class="slds-m-top_medium slds-text-align_center slds-text-color_weak slds-text-body_small">
                        Secure checkout powered by Salesforce.
                    </p>
                </div>
            </div>
        </div>
    </div>
</template>
