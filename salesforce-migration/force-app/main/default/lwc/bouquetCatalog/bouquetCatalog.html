<template>
    <div class="slds-p-around_medium">
        <h1 class="slds-text-heading_large slds-m-bottom_small">Catalog</h1>
        <p class="slds-text-color_weak slds-m-bottom_large">Find the perfect bouquet for your occasion</p>

        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large slds-grid_vertical-align-end">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-input type="search" label="Search" placeholder="Search Rose, Tulip..." onchange={handleSearchChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-combobox label="Sort By" value={sortBy} options={sortOptions} onchange={handleSortChange}></lightning-combobox>
            </div>
        </div>

        <template if:true={products.data}>
            <template if:true={hasProducts}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={products.data} for:item="product">
                        <div key={product.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium">
                            <c-bouquet-product-card product={product} onordernow={handleOrderNow}></c-bouquet-product-card>
                        </div>
                    </template>
                </div>
            </template>
            <template if:false={hasProducts}>
                <div class="slds-align_absolute-center slds-m-top_xx-large">
                    <div class="slds-text-align_center">
                        <p class="slds-text-heading_medium slds-text-color_weak">No bouquets found matching your search.</p>
                        <lightning-button label="Clear search" variant="base" onclick={handleClearSearch} class="slds-m-top_small"></lightning-button>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={products.error}>
            <div class="slds-align_absolute-center slds-m-top_xx-large">
                <p class="slds-text-color_error">Error loading catalog. Please try again later.</p>
            </div>
        </template>

        <template if:false={products.data}>
            <template if:false={products.error}>
                <div class="slds-align_absolute-center" style="height: 300px;">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
        </template>
    </div>
</template>
