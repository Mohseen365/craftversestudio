<template>
    <div class="slds-p-around_medium">
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
            <h1 class="slds-text-heading_large">Capacity Planning</h1>
            <lightning-button-icon icon-name="utility:refresh" onclick={handleRefresh} variant="border-filled"></lightning-button-icon>
        </div>

        <div class="slds-scrollable_x">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">Date</th>
                        <th scope="col">Used / Capacity</th>
                        <th scope="col">Available</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.capacityDate} class="slds-hint-parent">
                            <td>{row.capacityDate}</td>
                            <td>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span>{row.used}h / {row.dailyCapacity}h</span>
                                    <lightning-button-icon icon-name="utility:edit" size="xx-small" class="slds-m-left_x-small" onclick={handleOpenOverride} data-date={row.capacityDate} data-cap={row.dailyCapacity}></lightning-button-icon>
                                </div>
                            </td>
                            <td class={row.remainingClass}>{row.remaining}h</td>
                            <td><span class={row.statusClass}>{row.statusLabel}</span></td>
                            <td>
                                <lightning-button label="View Details" variant="neutral" onclick={handleViewDetails} data-date={row.capacityDate}></lightning-button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Detail Modal -->
        <template if:true={isDetailModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeDetailModal}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Orders for {selectedDate}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Customer</th>
                                    <th>Allocated</th>
                                    <th>Completed</th>
                                    <th>Deadline</th>
                                    <th>Status</th>
                                    <th>Mark Work Done</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={selectedOrders} for:item="order">
                                    <tr key={order.orderId}>
                                        <td>{order.orderNumber}</td>
                                        <td>{order.customerName}</td>
                                        <td>{order.allocatedToday}h</td>
                                        <td class="slds-text-color_success">{order.completedEffort}h / {order.totalRequiredEffort}h</td>
                                        <td>{order.productionDeadline}</td>
                                        <td>{order.status}</td>
                                        <td>
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <lightning-input type="number" step="0.25" variant="label-hidden" placeholder="Hours" data-order-id={order.orderId} class="slds-m-right_x-small" style="width: 80px;"></lightning-input>
                                                <lightning-button-icon icon-name="utility:check" variant="border-filled" onclick={handleAddProgress} data-order-id={order.orderId}></lightning-button-icon>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
